[project]
name = "acexec"
version = "0.1.0"
description = "Replication of Almgren & Chriss (2000) optimal execution: closed-form trajectory, independent numerical verification, and the efficient frontier."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dashboard = ["streamlit>=1.32", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
acexec = "acexec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["acexec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
