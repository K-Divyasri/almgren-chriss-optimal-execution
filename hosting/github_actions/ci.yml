# Copy this file to .github/workflows/ci.yml at the repo root (GitHub only
# discovers workflow files there) to run the test suite on every push and
# pull request touching this project.
name: acexec CI

on:
  push:
    paths:
      - "42-almgren-chriss-optimal-execution/build_from_scratch/**"
  pull_request:
    paths:
      - "42-almgren-chriss-optimal-execution/build_from_scratch/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 42-almgren-chriss-optimal-execution/build_from_scratch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acexec and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q

      - name: Smoke-test the CLI
        run: |
          python -m acexec trajectory --lam 1e-6
          python -m acexec frontier
          python -m acexec verify
